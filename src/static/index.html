<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <div class="section-heading">
          <h3>Available Activities</h3>
          <span id="activity-count" class="activity-count" aria-live="polite"></span>
        </div>
        <div class="activity-controls" aria-label="Activity filters">
          <label class="search-field" for="activity-search">
            <span>Search activities</span>
            <input type="search" id="activity-search" placeholder="Search by name or description" />
          </label>
          <label for="category-filter">
            <span>Category</span>
            <select id="category-filter">
              <option value="all">All categories</option>
            </select>
          </label>
          <label for="sort-activities">
            <span>Sort by</span>
            <select id="sort-activities">
              <option value="name">Name</option>
              <option value="schedule">Schedule</option>
            </select>
          </label>
        </div>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
